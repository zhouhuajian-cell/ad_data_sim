<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OBJ 交通目标</title>
<style>
  body { margin: 0; background: #111827; color: #e2e8f0; font: 16px system-ui, sans-serif; }
  main { max-width: 1200px; margin: auto; padding: 24px; }
  a { color: #76dfdb; }
  section { margin: 18px 0; padding: 18px; background: #1e293b; border-radius: 8px; }
  button { background: #76dfdb; color: #10242d; border: 0; padding: 10px 16px; border-radius: 6px; font: inherit; cursor: pointer; }
  button:disabled { opacity: .55; cursor: wait; }
  img { display: block; width: 100%; height: auto; }
  pre { white-space: pre-wrap; overflow-wrap: anywhere; max-height: 300px; overflow: auto; }
</style>
<main>
<!-- GND-REAL: 真实底图 2.5D 标线投影 -->
<div id="gndReal" style="margin:18px 0;padding:18px;background:#1e293b;border-radius:8px">
  <div style="display:flex;align-items:center;gap:10px;margin-bottom:14px">
    <span style="color:#e2e8f0;font-size:16px;font-weight:600">GND 真实底图投影</span>
    <span style="color:#94a3b8;font-size:12px">磨损纹理 + 人工标定，直接投到实拍路面</span>
  </div>
  <div style="display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:12px">
    <label style="color:#94a3b8;font-size:13px">底图
      <select id="grBg" style="background:#0b1120;border:1px solid #334155;color:#e2e8f0;border-radius:5px;padding:5px 8px;font-size:13px;margin-left:6px">
        <option>加载中…</option>
      </select>
    </label>
    <label style="color:#94a3b8;font-size:13px">车道数
      <input id="grLanes" value="3" style="width:50px;background:#0b1120;border:1px solid #334155;color:#e2e8f0;border-radius:5px;padding:5px 6px;font-size:13px;margin-left:6px">
    </label>
    <label style="color:#94a3b8;font-size:13px"><input type="checkbox" id="grDash" checked> 中间虚线</label>
    <label style="color:#94a3b8;font-size:13px"><input type="checkbox" id="grStop"> 加停止线</label>
    <button id="grRun">生成标线</button>
  </div>
  <div id="grMsg" style="color:#94a3b8;font-size:13px;min-height:18px"></div>
  <div id="grOut" style="margin-top:14px"></div>
</div>

  <section id="local-entry" hidden>
    <p>正在打开服务器上的 OBJ 工作台。</p>
    <a href="http://10.2.248.34:8010/obj">打开 OBJ 工作台</a>
  </section>
  <div id="workspace">
  <a href="/">返回工作台</a>
  <nav aria-label="BEV 仿真模块">
    <a href="/bev">OBJ 交通目标</a> · <a href="/bev?module=gnd">GND 地面标线</a>
  </nav>
  <h1>BEV 仿真工作台</h1>
  <h2 id="module-title">OBJ 交通目标</h2>
  <section>
    <p id="description">用车辆、行人和锥桶代理模型渲染 3 帧 RGB，并导出 2D 标注。启动 UE 可能需要几分钟。</p>
    <label id="sample-control">场景
      <select id="sample">
        <option value="traffic">车辆、行人和锥桶</option>
        <option value="truck">卡车代理</option>
        <option value="workzone">道路施工（卡车、锥桶和标线）</option>
      </select>
    </label>
    <button id="run" disabled>运行三帧小样</button>
    <p id="status" role="status">正在获取作业状态</p>
    <details id="details" hidden><summary>作业日志</summary><pre id="log"></pre></details>
  </section>
  <section id="result" hidden>
    <h2 id="title">上次完成的小样</h2>
    <img id="sheet" alt="三帧渲染与标注抽检图">
    <p><a id="annotations" download>下载标注</a></p>
    <p id="scene-download" hidden><a id="scene-annotations" download="scene_annotations.json">下载标线与障碍物完整 JSON</a></p>
  </section>
  </div>
</main>
<script>
const run = document.getElementById('run');
const status = document.getElementById('status');
const mode = location.pathname === '/gnd' ||
  new URLSearchParams(location.search).get('module') === 'gnd' ? 'gnd' : 'obj';
const endpoint = '/api/' + mode;
const annotations = document.getElementById('annotations');
const sample = document.getElementById('sample');
if (mode === 'gnd') {
  document.getElementById('sample-control').hidden = true;
  document.title = document.getElementById('module-title').textContent = 'GND 地面标线';
  document.getElementById('description').textContent =
    '渲染 3 帧道路标线，包含白色边线、白色虚线、黄色实线和停止线。启动 UE 可能需要几分钟。';
  annotations.textContent = '下载标线分段投影 JSON';
  annotations.download = 'ground_annotations.json';
} else {
  annotations.textContent = '下载 COCO 标注';
  annotations.download = 'instances_all.json';
}
let polling;
let displayed;

async function request(path, method = 'GET') {
  const options = {method, cache: 'no-store'};
  if (method === 'POST') {
    options.headers = {'Content-Type': 'application/json'};
    options.body = JSON.stringify({sample: mode === 'obj' ? sample.value : 'traffic'});
  }
  const response = await fetch(path, options);
  const data = await response.json();
  if (!response.ok) throw new Error(data.error || '请求失败');
  return data;
}

async function refresh() {
  try {
    const {job, result, busy, result_sample} = await request(endpoint + '/status');
    run.disabled = busy;
    status.textContent = {
      running: '正在运行，完成后会显示本次抽检图。',
      ok: '小样已完成。',
      fail: '小样失败，请查看作业日志。'
    }[job?.status] || (busy ? 'UE 正在运行其他任务。' : '可以启动小样。');
    if (job) {
      document.getElementById('details').hidden = false;
      document.getElementById('log').textContent = job.log;
    }
    if (result && result !== displayed) {
      const names = {truck: '卡车代理', workzone: '道路施工'};
      document.getElementById('title').textContent = '上次完成的小样' +
        (names[result_sample] ? ' · ' + names[result_sample] : '');
      document.getElementById('scene-download').hidden = result_sample !== 'workzone';
      document.getElementById('scene-annotations').href = endpoint + '/result/' + result + '/scene';
      document.getElementById('sheet').src = endpoint + '/result/' + result + '/sheet';
      annotations.href = endpoint + '/result/' + result + '/annotations';
      document.getElementById('result').hidden = false;
      displayed = result;
    }
  } catch (error) {
    status.textContent = error.message;
    run.disabled = false;
  }
}

async function poll() {
  await refresh();
  polling = setTimeout(poll, 3000);
}

run.onclick = async () => {
  clearTimeout(polling);
  run.disabled = true;
  try {
    await request(endpoint + '/run', 'POST');
  } catch (error) {
    status.textContent = error.message;
    run.disabled = false;
    polling = setTimeout(poll, 5000);
    return;
  }
  await poll();
};
if (location.protocol === 'file:') {
  document.getElementById('workspace').hidden = true;
  const entry = document.getElementById('local-entry');
  entry.hidden = false;
  location.replace(entry.querySelector('a').href);
} else {
  poll();
}
</script>

<script>
(function(){
  'use strict';
  var BG_LIST = [];
  function $(id){ return document.getElementById(id); }

  async function loadBg(){
    try {
      var r = await fetch('/api/tsr/bg_list', {cache:'no-store'});
      var d = await r.json();
      BG_LIST = d.images || [];
      var sel = $('grBg');
      if (!sel) return;
      sel.innerHTML = BG_LIST.map(function(it){
        return '<option value="' + it.name + '">' + it.name + '</option>';
      }).join('');
      if (BG_LIST.some(function(x){ return x.name==='cand_04.jpg'; })) {
        sel.value = 'cand_04.jpg';
      }
    } catch(e) {}
  }

  function buildLines(){
    var n = parseInt($('grLanes').value, 10) || 3;
    var dash = $('grDash').checked;
    var stop = $('grStop').checked;
    var parts = [];
    var laneW = 3.5, half = n * laneW / 2;
    for (var i = 0; i <= n; i++) {
      var y = -half + i * laneW;
      var edge = (i === 0 || i === n);
      var cls = edge ? 'road_edge_white' : (dash ? 'lane_dashed_white' : 'lane_solid_white');
      parts.push(cls + ',' + y.toFixed(2) + ',6,14');
    }
    if (stop) parts.push('stop_line,0,20,0.4');
    return parts.join(';');
  }

  async function run(){
    var btn = $('grRun');
    btn.disabled = true; btn.textContent = '生成中…';
    $('grMsg').textContent = '正在投影…';
    $('grOut').innerHTML = '';
    try {
      var r = await fetch('/api/gnd/project', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ bg: $('grBg').value, lines: buildLines() })
      });
      var d = await r.json();
      if (!d.ok) {
        $('grMsg').innerHTML = '<span style="color:#f87171">失败：' +
          String(d.error||'unknown').replace(/</g,'&lt;').slice(0,400) + '</span>';
        return;
      }
      $('grMsg').innerHTML = '<span style="color:#4ade80">完成 · ' +
        (d.lines||[]).length + ' 条标线 · training_eligible=' + d.training_eligible + '</span>';
      if (d.image_url) {
        // image_url 已含 ? 参数，用 & 追加时间戳避免缓存
        var u = d.image_url + (d.image_url.indexOf('?') >= 0 ? '&' : '?') + 't=' + Date.now();
        $('grOut').innerHTML =
          '<img src="' + u + '" style="border-radius:8px">' +
          '<pre style="margin-top:10px;color:#94a3b8;font-size:12px">' +
          (d.lines||[]).map(function(l){
            return l.class + '  width=' + l.width_m + 'm  alpha=' + (l.alpha_mean||0).toFixed(4);
          }).join('\n') + '</pre>';
      }
    } catch(e) {
      $('grMsg').innerHTML = '<span style="color:#f87171">请求失败：' + e.message + '</span>';
    } finally {
      btn.disabled = false; btn.textContent = '生成标线';
    }
  }

  setTimeout(function(){
    loadBg();
    var b = $('grRun');
    if (b) b.onclick = run;
  }, 300);
})();
</script>
</html>
